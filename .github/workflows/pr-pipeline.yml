name: "Pipeline: PR"
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest code
        uses: actions/checkout@v7

      - name: Install tinygo and dependencies
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
          sudo dpkg -i tinygo_0.42.0_amd64.deb
          sudo apt install -y binaryen

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build plugin
        run: make prod

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: listenbrainz-daily-playlist
          path: listenbrainz-daily-playlist.ndp
